# ncmpcpp config - bytewm setup
mpd_host = "localhost"
mpd_port = "6600"

# show bitrate of the current song in the status line (bottom)
display_bitrate = yes

# status line:  artist - "album" (year) - title   [bitrate shown via display_bitrate]
song_status_format = {{%a{ "%b"{ (%y)}} - }{%t}}|{%f}
