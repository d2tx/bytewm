<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family"><string>6x13</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Misc Fixed</string></edit>
    <edit name="style" mode="assign"><string>SemiCondensed</string></edit>
    <edit name="pixelsize" mode="assign"><double>13</double></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>9x15</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Misc Fixed</string></edit>
    <edit name="pixelsize" mode="assign"><double>15</double></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>10x20</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Misc Fixed</string></edit>
    <edit name="pixelsize" mode="assign"><double>20</double></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Micro</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>micro.pcf</string></edit>
    <edit name="pixelsize" mode="assign"><double>13</double></edit>
  </match>
</fontconfig>
